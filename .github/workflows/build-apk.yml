name: Build APK

on:
  push:
    branches: [main, arena/01a0bd9b-trader]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK pieces
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Build APK
        run: |
          export BT="$ANDROID_HOME/build-tools/34.0.0"
          export PLATFORM="$ANDROID_HOME/platforms/android-34/android.jar"
          set -o pipefail
          bash scripts/build-apk.sh 2>&1 | tee build.log

      - name: Publish build log on failure
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build.log
          git commit -m "debug: build failure log [skip ci]"
          for i in 1 2 3 4 5; do
            if git push origin HEAD:refs/heads/arena/01a0bd9b-trader; then exit 0; fi
            git fetch origin arena/01a0bd9b-trader
            if git rebase FETCH_HEAD; then sleep 3; else git rebase --abort; exit 1; fi
          done
          exit 1

      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs release/NobiTrader-v2.1.apk

      - uses: actions/upload-artifact@v4
        with:
          name: NobiTrader-APK
          path: release/NobiTrader-v2.1.apk

      - name: Commit APK back to the branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f release/NobiTrader-v2.1.apk
          if git diff --cached --quiet; then
            echo "APK unchanged"
          else
            git commit -m "chore: build APK [skip ci]"
            # the live-test workflow may push concurrently — rebase and retry
            for i in 1 2 3 4 5; do
              if git push origin HEAD:refs/heads/arena/01a0bd9b-trader; then
                echo "APK pushed on attempt $i"
                exit 0
              fi
              git fetch origin arena/01a0bd9b-trader
              if git rebase FETCH_HEAD; then
                sleep 3
              else
                git rebase --abort
                exit 1
              fi
            done
            echo "could not push the APK after 5 attempts"
            exit 1
          fi
