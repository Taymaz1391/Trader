name: Build APK

on:
  push:
    branches: [main, arena/01a0bd9b-trader]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK pieces
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Build APK
        run: |
          export BT="$ANDROID_HOME/build-tools/34.0.0"
          export PLATFORM="$ANDROID_HOME/platforms/android-34/android.jar"
          bash scripts/build-apk.sh

      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs release/NobiTrader-v1.7.apk

      - uses: actions/upload-artifact@v4
        with:
          name: NobiTrader-APK
          path: release/NobiTrader-v1.7.apk

      - name: Commit APK back to the branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f release/NobiTrader-v1.7.apk
          if git diff --cached --quiet; then
            echo "APK unchanged"
          else
            git commit -m "chore: build APK [skip ci]"
            git push
          fi
