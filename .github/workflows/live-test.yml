name: Live Nobitex API Test

on:
  workflow_dispatch:
  push:
    branches: [arena/01a0bd9b-trader]

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compile the app's real API classes (no Android deps)
        run: |
          mkdir -p build/live
          javac -encoding UTF-8 -sourcepath src -d build/live livetest/LiveTest.java

      - name: Run live test against the real Nobitex API
        run: |
          java -cp build/live ir.nobitrader.bot.LiveTest 2>&1 | tee livetest/last-run.log

      - name: Commit the live-test log back to the branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add livetest/last-run.log
          if git diff --cached --quiet; then
            echo "log unchanged"
          else
            git commit -m "chore: live-test log [skip ci]"
            for i in 1 2 3; do
              git pull --rebase origin arena/01a0bd9b-trader && git push && break
              echo "retry $i…"; sleep 5
            done
          fi
