name: Live Nobitex API Test

on:
  push:
    branches: [arena/01a0bd9b-trader]
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compile the app's real API classes (no Android deps)
        run: |
          mkdir -p build/live
          javac -encoding UTF-8 -sourcepath src -d build/live livetest/LiveTest.java

      - name: Run live test against the real Nobitex API
        run: |
          java -cp build/live ir.nobitrader.bot.LiveTest 2>&1 | tee livetest/last-run.log

      - name: Commit the live-test log back to the branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add livetest/last-run.log
          if git diff --cached --quiet; then
            echo "log unchanged"
            exit 0
          fi
          SUMMARY=$(grep -E "server response|متصل|خطای سرور|LIVE TEST" livetest/last-run.log | head -4 | tr '\n' ' ')
          git commit -m "chore: live-test log [skip ci] — ${SUMMARY}"
          # the APK workflow may push concurrently — rebase and retry with real exit codes
          for i in 1 2 3 4 5; do
            if git push origin HEAD:refs/heads/arena/01a0bd9b-trader; then
              echo "log pushed on attempt $i"
              exit 0
            fi
            git fetch origin arena/01a0bd9b-trader
            if git rebase FETCH_HEAD; then
              sleep 3
            else
              git rebase --abort
              exit 1
            fi
          done
          echo "could not push the log after 5 attempts"
          exit 1
