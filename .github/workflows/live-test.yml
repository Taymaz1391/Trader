name: Live Nobitex API Test

on:
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/01a0bd9b-trader

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compile the app's real API classes (no Android deps)
        run: |
          mkdir -p build/live
          javac -encoding UTF-8 -sourcepath src -d build/live livetest/LiveTest.java

      - name: Run live test against the real Nobitex API
        run: |
          java -cp build/live ir.nobitrader.bot.LiveTest 2>&1 | tee livetest/last-run.log

      - name: Commit the live-test log back to the branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add livetest/last-run.log
          if git diff --cached --quiet; then
            echo "log unchanged"
          else
            SUMMARY=$(grep -E "server response|متصل|خطای سرور|LIVE TEST" livetest/last-run.log | head -4 | tr '\n' ' | ')
            git commit -m "chore: live-test log — ${SUMMARY} [skip ci]"
            git push origin HEAD:refs/heads/arena/01a0bd9b-trader
          fi
